spring:
  application:
    name: cinebot
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cinebot}
    username: ${DB_USERNAME:cinebot}
    password: ${DB_PASSWORD:cinebot}
  jpa:
    open-in-view: false            # no lazy loading from controllers; transactions end in the service layer
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Lazy collections (e.g. movie.genres on a page of 20 movies) load in one IN (...) query
        # instead of 20 separate queries: the standard fix for N+1 selects.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      # The LLM provider is OFF unless configured: the Gemini starter refuses to start without a key, and the
      # rest of the app must run (and be tested) without one. Enable with AI_CHAT_PROVIDER=google-genai.
      chat: ${AI_CHAT_PROVIDER:none}
      embedding:
        text: none                 # no embeddings used (yet)
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}  # env var only, never in source / git
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.2       # tool selection + argument extraction: we want consistency, not creativity
    retry:
      max-attempts: 2              # one retry on transient provider errors; the user is waiting
      backoff:
        initial-interval: 500ms
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:}
      # Fail fast: Redis is an optimisation for seat locking, so a slow Redis must not slow down bookings.
      timeout: 250ms
      connect-timeout: 250ms
  http:
    client:
      # Applies to every RestClient.Builder Spring creates (TMDB now, Gemini later). Never call out without timeouts.
      connect-timeout: 3s
      read-timeout: 10s

server:
  port: ${PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Booking stays correct without Redis, so a Redis outage must not take instances out of rotation.
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

cinebot:
  jwt:
    secret: ${JWT_SECRET}          # required outside dev/test; min 32 bytes
    issuer: cinebot
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  tmdb:
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p
    # Provide ONE of these (TMDB -> Settings -> API). The read-access token is preferred: it travels in a header,
    # while the v3 api key goes in the URL query string, where proxies and access logs can capture it.
    read-access-token: ${TMDB_READ_ACCESS_TOKEN:}
    api-key: ${TMDB_API_KEY:}
    region: IN
    language: en-US
    sync:
      pages: 2                     # 20 movies per page of "now playing"
      cron: ${TMDB_SYNC_CRON:-}    # "-" disables; e.g. "0 0 3 * * *" for daily 03:00 IST
  booking:
    lock-ttl: 8m
    max-seats-per-lock: 10
    # a lock whose booking is PAYMENT_PENDING is swept only this long after expiry, giving in-flight payments
    # a chance to confirm (seats are still takeable by others meanwhile: lazy expiry is unchanged)
    payment-grace: PT2M
    cancellation-cutoff: PT2H   # confirmed bookings can be cancelled (refunded) until 2h before the show
    sweeper:
      enabled: true
      interval: PT30S
      batch-size: 100
  payment:
    provider: SIMULATED
    reconciler:
      enabled: true
      interval: PT1M
      stuck-after: PT2M        # CREATED orders older than this are checked against the provider
      batch-size: 50
    faults:
      enabled: false           # dev/test only: lets you inject "crash after capture" to exercise recovery
    simulator:
      key-secret: ${PAYMENT_KEY_SECRET}         # signs checkout callbacks (orderId|paymentId)
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET} # signs webhook bodies
      checkout-enabled: true
      webhook-delivery: HTTP                     # HTTP | NONE
      webhook-url: http://localhost:${server.port}/api/v1/payments/webhook
      webhook-delay: PT2S
      duplicate-webhooks: false                  # deliver every webhook twice (tests de-duplication)
      refund-processing-delay: PT5S
  ticket:
    secret: ${TICKET_SECRET}
  agent:
    max-tool-rounds: 6        # model <-> tools round trips per user message; stops runaway loops
    history-size: 40          # stored messages replayed to the model (window always starts at a user message)
    confirmation-ttl: PT10M   # a prepared hold / cancellation must be confirmed within this time
    llm-timeout: ${GEMINI_TIMEOUT:PT30S}  # per Gemini call; without it an overloaded model hangs the chat forever
  outbox:
    relay:
      enabled: true
      interval: PT1S
    batch-size: 50
    lease: PT30S            # a worker that dies mid-batch loses its claim after this; another worker retries
    max-attempts: 8         # then the event is DEAD (dead-letter) until an admin retries it
    max-backoff: PT10M
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
